name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions:
  contents: read

# Supersede superseded pull request runs, but never cancel a run on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The build integration starts the export tool from MSBuild and resolves paths for it, so it is
        # exercised on both path flavours
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore DotNetSchema.slnx

      # Builds src, tests and samples; the fixtures and the sample host run the in-repository export
      # integration end to end as part of the build
      - run: dotnet build DotNetSchema.slnx -c Release --no-restore

      - run: dotnet test DotNetSchema.slnx -c Release --no-build

      # Proves the package, with the pre-published export tool under tools/, still packs
      - run: ./scripts/pack.sh
        shell: bash

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/packages/*.nupkg
